name: Sync GitHub Pages bundle

# The live site deploys from branch `main` / (not the Vite dist artifact).
# After each main push, rebuild and commit assets/game.js + game.css so
# index.html's source fallback can boot the game.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-bundle
  cancel-in-progress: false

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and copy Pages bundle
        run: npm run build:pages

      - name: Commit bundle if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game.js assets/game.css index.html sw.js manifest.webmanifest icons public
          if git diff --staged --quiet; then
            echo "No bundle changes"
            exit 0
          fi
          git commit -m "Update GitHub Pages production bundle."
          git push
