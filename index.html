<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No screen-orientation lock meta tag here: that non-standard tag can
         prevent the browser from rotating when the user turns the device, and
         instead we use JavaScript + CSS to prompt for landscape on phones. -->

    <title>Secret Wars</title>
  </head>
  <body>
    <main id="game" aria-label="Secret Wars game"></main>
    <!-- Hidden by default; shown via JavaScript on touch-first devices held in portrait. -->
    <aside id="rotate-device" aria-live="polite">
      <button class="rotate-icon" type="button" aria-label="Rotate to landscape">
        ↻
      </button>
      <strong>ROTATE TO LANDSCAPE</strong>
      <span>Secret Wars is built for widescreen play.</span>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
